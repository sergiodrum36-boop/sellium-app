name: Compilar y publicar Sellium en Firebase Hosting

# Se ejecuta solo cuando llega un cambio a la rama "main" (es decir, cada vez
# que se hace "git push" desde "Subir cambios a GitHub.bat" o desde la subida
# inicial). No hace falta tocar nada manualmente: GitHub compila la app y la
# publica en Firebase Hosting automaticamente.
on:
  push:
    branches: [ main ]

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el codigo del repositorio
        uses: actions/checkout@v4

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Instalar dependencias
        # Usamos "npm install" en vez de "npm ci" porque package-lock.json
        # no estaba perfectamente sincronizado con package.json (npm ci
        # exige coincidencia exacta y fallaba). "npm install" es mas
        # tolerante y actualiza el lock si hace falta.
        run: npm install

      - name: Ejecutar tests (Jest)
        # Bloque 2 de la profesionalizacion (2026-07-25): tests de la logica
        # de negocio que no puede fallar en silencio (calculosAP.js,
        # matching.js, alertas.js, agregacionSellOutPorPeriodo.js). A
        # diferencia del lint (paso siguiente), ESTE paso SI bloquea el
        # deploy si algo falla -- son tests deterministas y nuevos, pensados
        # para no dar falsos positivos.
        run: npm test -- --watchAll=false
        env:
          CI: true

      - name: Revisar avisos de ESLint (no bloquea el deploy todavia)
        # No se ha podido medir en el sandbox de Claude cuantos warnings de
        # ESLint arrastra ya el resto de la app (el proceso se queda colgado
        # sin red al intentarlo ahi) -- por eso este paso es informativo por
        # ahora ("continue-on-error"), no bloqueante: si tuviera muchos
        # avisos previos, un gate estricto de golpe rompería el deploy sin
        # avisar. Revisa el resultado de este paso en la pestaña Actions; en
        # cuanto confirmes cuantos avisos hay y cuales quieres corregir,
        # cambia "continue-on-error: true" a "false" para que sea un gate de
        # verdad.
        run: npx eslint src --ext .js,.jsx
        continue-on-error: true

      - name: Generar la version de produccion (build)
        # CI=false: por defecto, GitHub Actions define CI=true, y
        # Create React App con CI=true convierte los "warnings" de ESLint
        # (como variables sin usar) en errores que rompen el build. En tu
        # PC, sin esa variable, esos mismos avisos son solo warnings y el
        # build termina bien. Con CI=false se comporta igual que en tu PC.
        run: npm run build
        env:
          CI: false

      - name: Publicar en Firebase Hosting
        run: npx firebase-tools deploy --only hosting --token "${{ secrets.FIREBASE_TOKEN }}" --non-interactive
